name: SDK — TypeScript

on:
  push:
    branches: [main]
    paths:
      - 'packages/backend/sdk/**'
      - 'spec/**'
  pull_request:
    paths:
      - 'packages/backend/sdk/**'
      - 'spec/**'

defaults:
  run:
    working-directory: packages/backend/sdk

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
        env:
          FLUXIS_API_KEY: ${{ secrets.FLUXIS_API_KEY }}
          FLUXIS_API_SECRET: ${{ secrets.FLUXIS_API_SECRET }}

name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

# Avoid collisions when two release PRs merge close together (release-please#2746).
concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      ts_release_created: ${{ steps.release.outputs['packages/backend/sdk--release_created'] }}
      ts_tag_name: ${{ steps.release.outputs['packages/backend/sdk--tag_name'] }}
      ts_version: ${{ steps.release.outputs['packages/backend/sdk--version'] }}
      cs_release_created: ${{ steps.release.outputs['packages/backend/sdk-csharp--release_created'] }}
      cs_tag_name: ${{ steps.release.outputs['packages/backend/sdk-csharp--tag_name'] }}
      cs_version: ${{ steps.release.outputs['packages/backend/sdk-csharp--version'] }}
      react_release_created: ${{ steps.release.outputs['packages/frontend/react--release_created'] }}
      react_tag_name: ${{ steps.release.outputs['packages/frontend/react--tag_name'] }}
      react_version: ${{ steps.release.outputs['packages/frontend/react--version'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # When one component release merges, sibling release-please PRs touch the same
  # manifest and become conflicting. Close them so the next workflow run recreates
  # clean PRs against the updated main (release-please#1870).
  refresh-stale-release-prs:
    needs: release-please
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              base: 'main',
              per_page: 100,
            });

            for (const pr of prs) {
              if (!pr.head.ref.startsWith('release-please--')) continue;

              core.info(`Closing stale release PR #${pr.number}: ${pr.title}`);
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body: [
                  'Auto-closed: another release PR merged and updated `.release-please-manifest.json`.',
                  '',
                  'Run **Actions → Release Please → Run workflow** (or push to `main`) to open a fresh release PR for this component.',
                ].join('\n'),
              });
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pr.number,
                state: 'closed',
              });
            }

  publish-csharp:
    needs: release-please
    if: needs.release-please.outputs.cs_release_created == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/backend/sdk-csharp
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build
        env:
          FLUXIS_API_KEY: ${{ secrets.FLUXIS_API_KEY }}
          FLUXIS_API_SECRET: ${{ secrets.FLUXIS_API_SECRET }}

      - name: Pack
        run: dotnet pack -c Release --no-restore -o ./artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: Fluxis.Sdk.${{ needs.release-please.outputs.cs_version }}.nupkg
          path: packages/backend/sdk-csharp/artifacts/*.nupkg

      - name: Publish to NuGet
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate

  publish-react:
    needs: release-please
    if: needs.release-please.outputs.react_release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspace=packages/frontend/react

      - name: Build
        run: npm run build --workspace=packages/frontend/react

      - name: Test
        run: npm run test --workspace=packages/frontend/react

      - name: Publish to npm
        run: npm publish --workspace=packages/frontend/react --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

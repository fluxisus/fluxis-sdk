name: SDK — Frontend

on:
  push:
    branches: [main]
    paths:
      - 'packages/frontend/**'
  pull_request:
    paths:
      - 'packages/frontend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: ./scripts/frontend.sh build

      - name: Lint
        run: ./scripts/frontend.sh lint

      - name: Test
        run: ./scripts/frontend.sh test

name: SDK — Go

# Trigger strategy:
#   • build-and-test  → any push/PR touching sdk-go or spec paths
#   • mirror          → only when a tag like `sdk-go/v1.2.3` is pushed (by release-please)
#
# Go publishing: mirror sdk-go to the public fluxis-go-sdk repo, then proxy.golang.org
# indexes the root tag (v1.2.3) automatically.

on:
  push:
    branches: [main]
    paths:
      - 'packages/backend/sdk-go/**'
      - 'spec/**'
    tags:
      - 'sdk-go/v*'
  pull_request:
    paths:
      - 'packages/backend/sdk-go/**'
      - 'spec/**'

defaults:
  run:
    working-directory: packages/backend/sdk-go

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.22', '1.23']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -v
        env:
          FLUXIS_API_KEY: ${{ secrets.FLUXIS_API_KEY }}
          FLUXIS_API_SECRET: ${{ secrets.FLUXIS_API_SECRET }}

  mirror:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/sdk-go/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#sdk-go/v}" >> "$GITHUB_OUTPUT"

      - name: Build mirror snapshot
        working-directory: ${{ github.workspace }}
        run: |
          rm -rf /tmp/mirror && mkdir -p /tmp/mirror
          rsync -a --delete \
            --exclude '.git' --exclude '.env' --exclude 'CLAUDE.md' \
            packages/backend/sdk-go/ /tmp/mirror/

      - name: Push to public repo
        env:
          GH_PAT: ${{ secrets.GO_SDK_MIRROR_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cd /tmp/mirror
          git init -q && git checkout -q -b main
          git config user.name "fluxis-bot"
          git config user.email "dev@fluxis.us"
          git add -A && git commit -q -m "release: v${VERSION}"
          git tag "v${VERSION}"
          git remote add origin "https://x-access-token:${GH_PAT}@github.com/fluxisus/fluxis-go-sdk.git"
          git push --force origin main
          git push --force origin "v${VERSION}"

      - name: Request pkg.go.dev indexing
        run: |
          M="github.com/fluxisus/fluxis-go-sdk"
          V="v${{ steps.version.outputs.VERSION }}"
          echo "Requesting proxy index for ${M}@${V}"
          curl -sSf "https://proxy.golang.org/${M}/@v/${V}.info" || true
          curl -sSf "https://sum.golang.org/lookup/${M}@${V}" || true
          echo "Module published: ${M}@${V}"
          echo "View at: https://pkg.go.dev/${M}@${V}"
